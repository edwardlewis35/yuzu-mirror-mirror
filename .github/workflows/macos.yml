name: 'yuzu macos'

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos.yml'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'src/**'
      - 'externals/**'
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: 'macOS (arm64)'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      QT5_PREFIX: /opt/homebrew/opt/qt@5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install qt@5 boost lz4 zstd nlohmann-json ffmpeg opus pkg-config cmake ninja

      - name: Build fmt 9.1.0
        run: |
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o fmt-9.1.0.tar.gz
          tar -xf fmt-9.1.0.tar.gz
          cmake -S fmt-9.1.0 -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fmt"
          cmake --build fmt-build --parallel
          cmake --install fmt-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$QT5_PREFIX;$RUNNER_TEMP/fmt" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DYUZU_TESTS=OFF \
            -DENABLE_QT_TRANSLATION=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_USE_BUNDLED_VCPKG=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          APP=build/src/yuzu/yuzu.app
          test -d "$APP"
          "$QT5_PREFIX/bin/macdeployqt" "$APP"
          codesign --force --deep --sign - "$APP"
          VERSION=$(git describe --always --long --dirty)
          hdiutil create -volname "yuzu" -srcfolder "$APP" -ov -format UDZO "yuzu-macos-arm64-$VERSION.dmg"
          ls -lh yuzu-macos-arm64-*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuzu-macos-arm64
          path: yuzu-macos-arm64-*.dmg
